name: Verify Baseline Lab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-and-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned uv
        run: python3 -m pip install uv==0.13.6
      - name: Install Python and locked CPU dependencies
        run: |
          uv python install 3.12.14
          uv sync --frozen
      - name: Lint and types
        run: |
          uv run ruff check src scripts tests
          uv run ruff format --check src scripts tests
          uv run mypy src
      - name: Unit, integration and actual worker end-to-end
        run: uv run pytest -q -m 'not model'
      - name: Verify generated frontend contract
        run: |
          uv run python scripts/generate-types.py
          git diff --exit-code apps/web/src/contracts.ts
      - name: Check Node runtime
        run: node --version
      - name: Frontend install and production build
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
