  performance: not validated for distant tennis athletes
ball:
  adapter: ColorMotionBall
  revision: color-motion-v1
  weights: none
  license: MIT (original implementation)
  preprocess: original display BGR pixels; HSV yellow/white AND positive frame difference; initial static-white exclusion; circularity/local contrast; detected-person exclusion
  score_semantics: heuristic circularity/local-contrast score, not probability
  association: prediction gate; 200ms reacquisition; interpolation at most 3 frames and 100ms
  limitations: white clothing, lines, spectators, blur, occlusion, tiny balls, lighting
court:
