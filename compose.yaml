services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["baseline-data:/data"]
    environment:
      BASELINE_DATA_DIR: /data
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
  worker:
    build: .
    command: ["uv", "run", "--no-sync", "baseline-lab", "worker"]
    volumes: ["baseline-data:/data"]
    environment:
      BASELINE_DATA_DIR: /data
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2
    init: true
volumes:
  baseline-data:
