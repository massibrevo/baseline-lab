[project]
name = "baseline-lab"
version = "0.1.0"
description = "An honest, local-first tennis video analysis workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "av==19.0.2",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "imageio-ffmpeg==0.7.0",
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
    "pyyaml==6.0.3",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "uvicorn==0.54.0",
]

[project.scripts]
baseline-lab = "baseline_lab.cli:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baseline_lab"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/baseline_lab/vision/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: downloads and runs external pretrained weights"]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]


[[tool.mypy.overrides]]
module = "baseline_lab.vision.vendor.*"
ignore_errors = true
